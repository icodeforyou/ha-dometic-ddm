name: Release

# Pushing a tag like v0.1.0 publishes a GitHub release with dometic_ddm.zip attached.
# HACS reads `version` from manifest.json and, because hacs.json sets zip_release, downloads
# the zip from the release instead of the repository tree.
#
#   scripts/release.py 0.1.0     # bumps manifest.json, commits, tags v0.1.0
#   git push && git push --tags  # this workflow does the rest

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group dev

      - name: Check tag matches manifest version
        run: uv run python scripts/release.py --check "${GITHUB_REF_NAME}"

      - name: Check vendored pyddm is current
        run: uv run python scripts/sync_vendored.py --check

      - name: Lint, type-check, test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - name: Build dometic_ddm.zip
        run: |
          cd custom_components/dometic_ddm
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          zip -r ../../dometic_ddm.zip . -x '*.pyc'
          cd ../..
          unzip -l dometic_ddm.zip | head -20

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dometic_ddm.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
