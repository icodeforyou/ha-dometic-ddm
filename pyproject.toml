[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyddm"
version = "0.1.0a0"
description = "Transport-independent implementation of Dometic's DDM1/DDM2 BLE data model (CFX3, FreshJet, CFX5, ...)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Johan Thorstedt" }]
keywords = ["dometic", "cfx3", "freshjet", "ble", "bluetooth", "home-assistant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
# The core package has no runtime dependencies. Transports are optional.
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.urls]
Homepage = "https://github.com/icodeforyou/ha-dometic-ddm"
Documentation = "https://github.com/icodeforyou/ha-dometic-ddm/tree/main/docs"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # Pulls in homeassistant, bleak and bleak-retry-connector at the versions HA pins.
  "pytest-homeassistant-custom-component>=0.13.316",
  # Requirements of HA's bluetooth/usb/bluetooth_adapters components (their manifests),
  # needed to load the integration's `bluetooth_adapters` dependency in tests.
  "aiousbwatcher>=1.1.2",
  "bluetooth-adapters>=2.4.0",
  "bluetooth-auto-recovery>=1.6.4",
  "bluetooth-data-tools>=1.29.24",
  "dbus-fast>=5.0.22",
  "habluetooth>=6.26.11",
  "serialx>=1.10.0",
]

[tool.uv]
# The dev group pulls in Home Assistant, which only supports the newest Python. Resolve the
# lock for that interpreter; pyddm itself stays usable on 3.13.
environments = ["python_full_version >= '3.14.2'"]

[tool.hatch.build.targets.wheel]
packages = ["pyddm"]

[tool.hatch.build.targets.sdist]
include = ["pyddm", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["custom_components/dometic_ddm/pyddm"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "PL",       # pylint
  "T20",      # no print
  "PT",       # pytest style
  "ASYNC",    # asyncio pitfalls
]
ignore = [
  "PLR2004",  # magic values are the whole point of protocol tests
  "PLR0913",  # entity constructors take many arguments
  "PLR0911",  # codecs dispatch on type and return early
  "PLR0912",
  "RUF012",   # HA entity class attributes are mutable by convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["pyddm", "custom_components"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["pyddm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning:pyddm",
]
